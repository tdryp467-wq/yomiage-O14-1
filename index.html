<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>読み上げ原稿 O14-1 Chitto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='4' width='36' height='56' rx='7' fill='%23c2185b'/%3E%3Crect x='18' y='10' width='28' height='42' rx='3' fill='%23fff'/%3E%3Crect x='22' y='16' width='20' height='3' rx='1.5' fill='%23c2185b'/%3E%3Crect x='22' y='23' width='20' height='3' rx='1.5' fill='%23e091b0'/%3E%3Crect x='22' y='30' width='16' height='3' rx='1.5' fill='%23e091b0'/%3E%3Crect x='22' y='37' width='20' height='3' rx='1.5' fill='%23e091b0'/%3E%3Ccircle cx='32' cy='56' r='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1a1218;--panel:#261b23;--line:#3a2a35;--text:#f6eef2;--sub:#b9a5b0;
  --accent:#e2407e;--accent2:#ff8fb5;--ok:#3ecf8e;--warn:#ffb020;--bad:#ff5a5a;
  --fs:24px;
}
body.light{--bg:#fbf6f8;--panel:#fff;--line:#ecd9e1;--text:#2a1d24;--sub:#7d6672;--accent:#c2185b;--accent2:#c2185b}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* header */
header{flex:none;padding:8px 12px 6px;border-bottom:1px solid var(--line);background:var(--panel)}
.row{display:flex;align-items:center;gap:8px}
.no{font-weight:800;font-size:15px;color:var(--accent2);white-space:nowrap}
.ttl{flex:1;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:rgba(127,127,127,.12)}
.icon.on{background:var(--accent);color:#fff}
.timerbar{margin-top:6px;gap:6px}
.clock{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;letter-spacing:.02em;min-width:88px}
.clock.ok{color:var(--ok)}.clock.warn{color:var(--warn)}.clock.bad{color:var(--bad)}
.range{font-size:12px;color:var(--sub);line-height:1.25;flex:1}
.range b{color:var(--text);font-size:13px}
.tbtn{padding:7px 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.tbtn.ghost{background:rgba(127,127,127,.15);color:var(--text)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* main */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px;touch-action:pan-y}
.thumb{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:12px;background:#fff}
body.nothumb .thumb{display:none}
.script{font-size:var(--fs);line-height:1.75;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;outline:none}
.script.editing{background:rgba(127,127,127,.1);border-radius:8px;padding:8px;box-shadow:inset 0 0 0 2px var(--warn)}
.script .s{display:inline}
.script.mark .s:nth-child(even){color:var(--accent2)}
.meta{margin-top:14px;font-size:12px;color:var(--sub)}
.qa{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:99px;background:var(--warn);color:#000;font-size:12px;font-weight:800}

/* footer */
footer{flex:none;border-top:1px solid var(--line);background:var(--panel);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.next{font-size:12px;color:var(--sub);margin:0 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{color:var(--text)}
.nav{display:flex;gap:8px}
.nav button{flex:1;height:58px;border-radius:14px;font-size:20px;font-weight:800;background:rgba(127,127,127,.15)}
.nav button.go{flex:2;background:var(--accent);color:#fff}
.nav button:disabled{opacity:.3}

/* drawers */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:82dvh;overflow:auto;background:var(--panel);
  border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.panel h3{margin:0 0 10px;font-size:16px}
.toc button{display:flex;width:100%;text-align:left;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);align-items:center}
.toc button.cur{background:rgba(226,64,126,.15);border-radius:8px}
.toc .n{color:var(--accent2);font-weight:800;width:26px}
.toc .t{flex:1;font-size:14px}
.toc .r{font-size:11px;color:var(--sub);white-space:nowrap}
.set{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.set .ctl{display:flex;gap:6px;align-items:center}
.set .ctl button{min-width:44px;height:38px;border-radius:9px;background:rgba(127,127,127,.15);font-weight:800}
.set .ctl button.on{background:var(--accent);color:#fff}
.small{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
body.flashnext main{animation:fl .25s}
@keyframes fl{from{opacity:.3}to{opacity:1}}

/* 横画面：左にスライドと操作、右に原稿 */
#side{display:none}
@media (orientation:landscape){
  body{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"h h" "s m" "f m"}
  header{grid-area:h;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:5px 10px 4px}
  header .row{display:contents}
  .no{order:1;font-size:14px}
  .ttl{order:2;flex:1 1 0;min-width:0;font-size:13px}
  .clock{order:3;font-size:24px;min-width:0}
  .range{order:4;flex:none;font-size:10px;line-height:1.2;white-space:nowrap}
  .range b{font-size:11px}
  #bStart{order:5;padding:6px 10px;font-size:13px}
  #bReset{order:6;padding:6px 10px;font-size:13px}
  #bToc{order:7;width:32px;height:32px}
  #bSet{order:8;width:32px;height:32px}
  .prog{order:9;flex:0 0 100%;height:3px;margin-top:0}
  #side{grid-area:s;display:block;min-height:0;overflow:hidden;padding:8px 8px 0 10px;border-right:1px solid var(--line);touch-action:pan-y}
  #side .thumb{width:100%;height:auto;max-height:100%;object-fit:contain;margin:0}
  main{grid-area:m;padding:8px 16px calc(12px + env(safe-area-inset-bottom))}
  .script{line-height:1.6}
  .meta{margin-top:8px}
  footer{grid-area:f;padding:6px 8px calc(6px + env(safe-area-inset-bottom)) 10px;border-right:1px solid var(--line);border-top:0}
  .next{margin:0 2px 5px;font-size:11px}
  .nav button{height:46px;font-size:17px;border-radius:12px}
  /* スライド画像を消したときは原稿を全幅に */
  body.nothumb{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"h" "m" "f"}
  body.nothumb #side{display:none}
  body.nothumb footer{display:flex;align-items:center;gap:10px;border-right:0;border-top:1px solid var(--line)}
  body.nothumb .next{flex:1;min-width:0;margin:0 2px}
  body.nothumb .nav{flex:none;width:280px}
  .panel{left:50%;right:auto;transform:translateX(-50%);width:min(560px,100%);max-height:92dvh}
  .toast{top:30%}
}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="no" id="no">1 / 13</div>
    <div class="ttl" id="ttl"></div>
    <button class="icon" id="bToc" aria-label="目次">☰</button>
    <button class="icon" id="bSet" aria-label="設定">⚙</button>
  </div>
  <div class="row timerbar">
    <div class="clock" id="clock">0:00</div>
    <div class="range" id="range"></div>
    <button class="tbtn" id="bStart">▶ 開始</button>
    <button class="tbtn ghost" id="bReset">↺</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>

<aside id="side"></aside>

<main id="main">
  <img class="thumb" id="thumb" alt="">
  <div id="qa"></div>
  <div class="script" id="script"></div>
  <div class="meta" id="meta"></div>
</main>

<footer>
  <div class="next" id="next"></div>
  <div class="nav">
    <button id="bPrev">◀ 前</button>
    <button id="bNext" class="go">次へ ▶</button>
  </div>
</footer>

<div class="sheet" id="sToc"><div class="panel"><h3>スライド一覧</h3><div class="toc" id="toc"></div></div></div>
<div class="sheet" id="sSet"><div class="panel">
  <h3>表示設定</h3>
  <div class="set">文字サイズ<div class="ctl"><button id="fsM">A−</button><span id="fsV" style="min-width:40px;text-align:center">24</span><button id="fsP">A＋</button></div></div>
  <div class="set">スライド画像<div class="ctl"><button id="tgThumb">表示</button></div></div>
  <div class="set">文ごとに色分け<div class="ctl"><button id="tgMark">OFF</button></div></div>
  <div class="set">ライトモード<div class="ctl"><button id="tgLight">OFF</button></div></div>
  <div class="set">画面を常時点灯<div class="ctl"><button id="tgWake">OFF</button></div></div>
  <div class="set">本番の持ち時間<div class="ctl"><button id="limM">−</button><span id="limV" style="min-width:52px;text-align:center">5:20</span><button id="limP">＋</button></div></div>
  <div class="set">原稿を直す<div class="ctl"><button id="tgEdit">編集</button><button id="bRestore">元に戻す</button></div></div>
  <div class="small">
    操作：左右スワイプ／ボタン／Bluetoothリモコン（←→・PageUp/Down・Space）でページ送り。<br>
    スマホを横にすると、左にスライド、右に原稿の2列になります。文字サイズは縦と横で別々に覚えます。<br>
    タイマーは各スライドの予定時刻【0:15-0:50】と比べて、<span style="color:var(--ok)">緑＝予定内</span>・<span style="color:var(--warn)">黄＝このスライドの終了予定を過ぎた</span>・<span style="color:var(--bad)">赤＝持ち時間超過</span> で表示します。<br>
    編集した原稿・設定はこの端末に保存されます。
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = [{"title": "日本放射線腫瘍学会 第39回学術大会　一般口演14：看護・多職種連携", "note": "【0:00-0:10】\n山梨県立中央病院の岩澤です。よろしくお願いいたします。"}, {"title": "利益相反（COI）の開示", "note": "【0:10-0:15】\n本発表に関して、開示すべきCOIはありません。"}, {"title": "背景：患者の疑問と、限られた診療時間", "note": "【0:15-0:50】\n放射線治療を受ける患者さんの不安は、副作用だけでなく、費用や日常生活など多岐にわたります。\nしかし「忙しそうで聞きづらい」と遠慮され、私たちも限られた時間ですべてを傾聴することはできません。そして説明の重点は、どうしても副作用に置かれがちです。その結果、診察室では表面化しない「アンメットニーズ」が残されています。\nでは、気兼ねなく聞ける場所があったら、何が一番聞かれるのか。その答えは副作用だけではありませんでした。"}, {"title": "目的", "note": "【0:50-1:15】\n本研究の目的は3つです。\n1つ目は、導入・保守の負担を最小化したQ&Aシステムを構築すること。2つ目は、そのログから患者のアンメットニーズを可視化すること。3つ目は、多職種連携による患者サービス向上への活用性を評価することです。"}, {"title": "方法①：「Chitto（聞いてみるじゃん！）」の使い方", "note": "【1:15-2:05】\n構築したのが「Chitto（聞いてみるじゃん！）」です。Google Apps Scriptとスプレッドシートだけで作り、患者さんのスマートフォンで使えます。\n使い方は4ステップです。大分類のボタンを選び、中分類から質問を選ぶと、シートに登録した回答が表示されます。文字での検索や音声読み上げもできます。\n最後に、解決したかを答えていただき、解決なら満足度を、未解決なら理由を選んでいただきます。\n費用も保守の負担もかからず、回答に生成AIを使わないので誤った回答は出ません。"}, {"title": "方法②：評価方法", "note": "【2:05-2:25】\n評価は、放射線治療の経験がない診療放射線技師16名を模擬患者として行い、治療を受ける想定で自由に使ってもらいました。\n自己解決率は、システム回答提示後の「解決した」を選ばれた割合です。"}, {"title": "結果①：利用状況と自己解決率", "note": "【2:25-2:50】\n結果です。自己解決率は85%でした。\n16名の総操作は234件で、1人あたり約15操作と、少人数でも深く使われていました。そのうち回答が表示されたのが79件で、抄録の総回答数にあたります。\n解決したかに答えていただいたのが46件、そのうち39件が解決で、85%となります。\n"}, {"title": "結果②：入力経路と満足度評価", "note": "【2:50-3:15】\n入力経路と満足度評価については\n回答79件のうち、約8割の61件がカテゴリボタン経由で、自由入力は18件でした。利用者は文字を打つより、選択肢を選ぶ方を好んでおり、現在のUI設計が有効だったと考えます。\n満足度は、★4以上が78%、★1は0件でした。\n"}, {"title": "結果③：質問カテゴリからみたアンメットニーズ", "note": "【3:15-3:50】\nカテゴリ分類から見たニーズです。\n「治療前の準備・体制」が12回、「副作用・ケア」も12回、「お金・各種手続き」が11回と、ほぼ並びました。\n副作用と並んで、診察室では聞きにくい準備やお金の不安が上位に来ていました。これが最初の問いの答えです。こうしたアンメットニーズが、ログで初めて数字として見えました。"}, {"title": "結果④：未解決7件の要因分析", "note": "【3:50-4:20】\n未解決の結果は7件で、このような結果となりました。。\nそのうち理由を答えていただいた6件は、すべて「知りたい情報がない」でした。\nQ&A情報を追加すれば改善できることがわかりました。"}, {"title": "考察", "note": "【4:20-4:50】\n考察です。一番お伝えしたいのは、患者の声、つまり回答ログが、多職種の共通指標になるということです。\nログを見れば、医師は説明の重点を、看護師はケア指導を見直せ、技師は声掛けの強化やQ&Aの追加や修正ができます。\n各職種が自分のタイミングで確認することで、カンファレンスも増えません。なお、実患者・多施設での検証が今後の課題です。"}, {"title": "結論", "note": "【4:50-5:20】\n結論です。Google Apps Scriptとスプレッドシートだけで作ったシステムで、85%の自己解決率が得られました。\nそのログは患者のアンメットニーズを映し出し、多職種で共有することで、患者サービスの向上と業務効率化の両立につながると考えます。\nご清聴ありがとうございました。"}, {"title": "補足：操作ログの内訳（質疑用）", "note": "質疑用の補足スライド。本編では提示しない。"}];

const KEY='yomiage_O14-1_';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const LS=matchMedia('(orientation:landscape)');
const fsKey=()=>LS.matches?'fsL':'fs';

// 時間範囲を原稿から取り出す
const toSec=s=>{const[m,x]=s.split(':').map(Number);return m*60+x};
const slides=DATA.map((d,i)=>{
  const m=d.note.match(/^\s*【(\d+:\d{2})\s*[-–〜~]\s*(\d+:\d{2})】/);
  return {title:d.title,orig:d.note,
    start:m?toSec(m[1]):null,end:m?toSec(m[2]):null,
    qa:/質疑/.test(d.title)};
});
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const lastEnd=Math.max(...slides.map(s=>s.end||0));

let st={i:store.get('i',0),fs:store.get('fs',24),fsL:store.get('fsL',Math.min(innerWidth,innerHeight)<=520?20:28),thumb:store.get('thumb',true),mark:store.get('mark',false),
        light:store.get('light',false),wake:false,limit:store.get('limit',lastEnd||300),edits:store.get('edits',{})};
let running=false,t0=0,acc=0,editing=false;

const bodyText=i=>{
  const raw=(st.edits[i]!==undefined?st.edits[i]:slides[i].orig);
  return raw.replace(/^\s*【[^】]*】\s*/,'');
};

function render(){
  const i=st.i,s=slides[i],n=slides.length;
  $('no').textContent=(i+1)+' / '+n;
  $('ttl').textContent=s.title;
  $('thumb').src=IMGS[i];
  $('qa').innerHTML=s.qa?'<span class="qa">質疑応答用（本編では出さない）</span>':'';
  const sc=$('script');
  const txt=bodyText(i);
  if(editing){sc.textContent=txt}
  else{
    // 文ごとにspanで区切る（色分け用）
    sc.innerHTML='';
    (txt.match(/[^。！？\n]+[。！？]*|\n+/g)||[txt]).forEach(p=>{
      if(/^\n+$/.test(p)){sc.appendChild(document.createTextNode(p));return}
      const e=document.createElement('span');e.className='s';e.textContent=p;sc.appendChild(e)});
  }
  sc.classList.toggle('mark',st.mark);
  const chars=txt.replace(/\s/g,'').length;
  $('meta').textContent=`${chars}字（目安 約${Math.round(chars/5.5)}秒）`+(st.edits[i]!==undefined?'・編集済み':'');
  $('range').innerHTML=s.start!=null
    ? `予定 <b>${fmt(s.start)}–${fmt(s.end)}</b>（${s.end-s.start}秒）<br>持ち時間 ${fmt(st.limit)}`
    : `持ち時間 <b>${fmt(st.limit)}</b>`;
  const nx=slides[i+1];
  $('next').innerHTML=nx?`次：<b>${i+2}. ${esc(nx.title)}</b>`+(nx.qa?'（質疑用）':''):'これが最後のスライドです';
  $('bPrev').disabled=i===0;$('bNext').disabled=i===n-1;
  $('main').scrollTop=0;
  document.querySelectorAll('.toc button').forEach((b,k)=>b.classList.toggle('cur',k===i));
  store.set('i',i);tick();
}
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function go(d){
  const j=Math.min(slides.length-1,Math.max(0,st.i+d));
  if(j===st.i)return;
  if(editing)toggleEdit();
  st.i=j;document.body.classList.remove('flashnext');void document.body.offsetWidth;document.body.classList.add('flashnext');
  if(navigator.vibrate)navigator.vibrate(12);
  render();
}

// タイマー
const elapsed=()=>acc+(running?(performance.now()-t0)/1000:0);
function tick(){
  const e=elapsed(),s=slides[st.i],c=$('clock');
  c.textContent=fmt(e);
  c.className='clock '+(e>st.limit?'bad':(s.end!=null&&e>s.end&&running)?'warn':(running||e>0)?'ok':'');
  $('prog').style.width=Math.min(100,e/st.limit*100)+'%';
  $('prog').style.background=e>st.limit?'var(--bad)':'var(--accent)';
}
setInterval(()=>{if(running)tick()},250);
$('bStart').onclick=()=>{
  if(running){acc=elapsed();running=false;$('bStart').textContent='▶ 再開'}
  else{t0=performance.now();running=true;$('bStart').textContent='❚❚ 停止';wakeOn()}
  tick();
};
$('bReset').onclick=()=>{running=false;acc=0;$('bStart').textContent='▶ 開始';tick();toast('タイマーをリセットしました')};

// ナビ
$('bPrev').onclick=()=>go(-1);$('bNext').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(editing)return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
});
let sx=0,sy=0,stt=0;
['main','side'].forEach(id=>{
  $(id).addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;stt=Date.now()},{passive:true});
  $(id).addEventListener('touchend',e=>{
    if(editing)return;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-stt<700)go(dx<0?1:-1);
  },{passive:true});
});

// 目次
function buildToc(){
  $('toc').innerHTML='';
  slides.forEach((s,k)=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="n">${k+1}</span><span class="t">${esc(s.title)}</span><span class="r">${s.start!=null?fmt(s.start)+'–'+fmt(s.end):(s.qa?'質疑用':'')}</span>`;
    b.onclick=()=>{close();st.i=k;render()};
    $('toc').appendChild(b);
  });
}
const open=id=>$(id).classList.add('open');
const close=()=>document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
$('bToc').onclick=()=>{buildToc();render();open('sToc')};
$('bSet').onclick=()=>{syncSet();open('sSet')};
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)close()}));

// 設定
function applyLook(){
  document.documentElement.style.setProperty('--fs',st[fsKey()]+'px');
  document.body.classList.toggle('nothumb',!st.thumb);
  document.body.classList.toggle('light',st.light);
  document.querySelector('meta[name=theme-color]').content=st.light?'#fbf6f8':'#1a1218';
}
function syncSet(){
  $('fsV').textContent=st[fsKey()];
  const tg=(id,v,a,b)=>{$(id).textContent=v?a:b;$(id).classList.toggle('on',v)};
  tg('tgThumb',st.thumb,'表示','非表示');tg('tgMark',st.mark,'ON','OFF');
  tg('tgLight',st.light,'ON','OFF');tg('tgWake',st.wake,'ON','OFF');tg('tgEdit',editing,'保存','編集');
  $('limV').textContent=fmt(st.limit);
}
const save=()=>{['fs','fsL','thumb','mark','light','limit'].forEach(k=>store.set(k,st[k]));applyLook();syncSet();render()};
$('fsM').onclick=()=>{st[fsKey()]=Math.max(14,st[fsKey()]-2);save()};
$('fsP').onclick=()=>{st[fsKey()]=Math.min(48,st[fsKey()]+2);save()};
$('tgThumb').onclick=()=>{st.thumb=!st.thumb;save()};
$('tgMark').onclick=()=>{st.mark=!st.mark;save()};
$('tgLight').onclick=()=>{st.light=!st.light;save()};
$('limM').onclick=()=>{st.limit=Math.max(30,st.limit-10);save()};
$('limP').onclick=()=>{st.limit+=10;save()};
// ピンチで文字サイズ
let pd=0;
$('main').addEventListener('touchmove',e=>{
  if(e.touches.length!==2)return;
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pd){const r=d/pd;if(r>1.12||r<0.89){st[fsKey()]=Math.min(48,Math.max(14,st[fsKey()]+(r>1?2:-2)));pd=d;save()}}else pd=d;
},{passive:true});
$('main').addEventListener('touchend',()=>pd=0,{passive:true});

// 編集
function toggleEdit(){
  const sc=$('script');
  if(!editing){editing=true;render();sc.contentEditable='true';sc.classList.add('editing');sc.focus()}
  else{
    const v=sc.innerText.replace(/\n$/,'');
    const s=slides[st.i],head=(s.orig.match(/^\s*【[^】]*】/)||[''])[0];
    const full=head+v;
    if(full!==s.orig){st.edits[st.i]=full}else delete st.edits[st.i];
    store.set('edits',st.edits);editing=false;sc.contentEditable='false';sc.classList.remove('editing');render();toast('保存しました');
  }
  syncSet();
}
$('tgEdit').onclick=()=>{close();toggleEdit()};
$('bRestore').onclick=()=>{delete st.edits[st.i];store.set('edits',st.edits);editing=false;$('script').contentEditable='false';$('script').classList.remove('editing');render();syncSet();toast('このスライドの原稿を元に戻しました')};

// 画面常時点灯
let lock=null;
async function wakeOn(){
  try{if('wakeLock' in navigator){lock=await navigator.wakeLock.request('screen');st.wake=true;
    lock.addEventListener('release',()=>{st.wake=false;syncSet()})}}catch(e){}
  syncSet();
}
$('tgWake').onclick=async()=>{
  if(st.wake&&lock){await lock.release();lock=null;st.wake=false;syncSet()}
  else{await wakeOn();if(!st.wake)toast('この端末では常時点灯に対応していません')}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.wake===false&&lock)wakeOn()});

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}

// 向きに合わせてスライド画像の置き場所を変える
function placeThumb(){
  const th=$('thumb');
  if(LS.matches)$('side').prepend(th);else $('main').prepend(th);
}
LS.addEventListener('change',()=>{placeThumb();applyLook();syncSet()});

if(st.i>=slides.length)st.i=0;
placeThumb();applyLook();render();
// 初回タップで常時点灯を試みる
document.addEventListener('click',function f(){wakeOn();document.removeEventListener('click',f)},{once:true});
</script>
</body>
</html>
